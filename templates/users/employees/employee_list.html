<!-- users/employees/employee_list.html -->
<div>
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Gestión de Empleados</h2>
        <a href="{% url 'employee_create' %}" class="btn-primary" hx-get="{% url 'employee_create' %}" hx-target="#main-dynamic-content">
            + Nuevo Empleado
        </a>
    </div>

    <!-- Buscador en tiempo real con HTMX -->
    <div class="mb-6">
        <input type="text" name="q" placeholder="Buscar por nombre, apellido, CUIT/DNI o email..." 
               value="{{ search_query }}"
               class="form-input w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               hx-get="{% url 'employee_list' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#employee-table-container"
               autocomplete="off">
    </div>

    <!-- Contenedor de la Tabla -->
    <div id="employee-table-container">
        {% include 'users/employees/partials/employee_table.html' %}
    </div>
</div>
