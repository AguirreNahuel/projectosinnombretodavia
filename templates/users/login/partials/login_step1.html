<div>
    <h2 class="text-2xl font-bold text-center mb-6">Iniciar Sesión</h2>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form hx-post="{% url 'login' %}" hx-target="#login-container" hx-swap="innerHTML" class="space-y-4">
        <input type="hidden" name="verify_credentials" value="1">

        <div>
            <label class="form-label">Usuario o Correo Electrónico</label>
            <input type="text" name="identifier" required class="form-input">
        </div>

        <div>
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" required class="form-input">
        </div>

        <button type="submit" class="btn-primary">Continuar</button>
    </form>
</div>
